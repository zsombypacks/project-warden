name: Build
on: [push, workflow_dispatch]
jobs:
  build:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - name: Convert fonts
        run: |
          python -m pip install fonttools brotli
          python -c "from fontTools.ttLib import TTFont; [setattr(f, 'flavor', None) or f.save('assets/CursorGothic-%s.ttf' % n) for n in ('Regular','Bold') for f in [TTFont('assets/CursorGothic-%s.woff2' % n)]]"
      - run: cargo build --release
      - uses: actions/upload-artifact@v4
        with:
          name: ProjectWarden
          path: target/release/project-warden.exe
